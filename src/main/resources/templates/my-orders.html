<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>My Orders</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2 class="mb-4">My Orders</h2>

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>Order ID</th>

<th>Customer</th>

<th>Total</th>

<th>Status</th>

<th>Payment</th>

<th>Payment Status</th>

<th>Invoice</th>

<th>Track</th>

</tr>

</thead>

<tbody>

<tr th:each="order : ${orders}">

<td th:text="${order.id}"></td>

<td th:text="${order.customerName}"></td>

<td>
₹ <span th:text="${order.totalAmount}"></span>
</td>

<td>

    <span th:if="${order.status=='PLACED'}"
          class="badge bg-warning text-dark">
        PLACED
    </span>

    <span th:if="${order.status=='CONFIRMED'}"
          class="badge bg-info">
        CONFIRMED
    </span>

    <span th:if="${order.status=='PACKED'}"
          class="badge bg-primary">
        PACKED
    </span>

    <span th:if="${order.status=='SHIPPED'}"
          class="badge bg-secondary">
        SHIPPED
    </span>

    <span th:if="${order.status=='OUT FOR DELIVERY'}"
          class="badge bg-dark">
        OUT FOR DELIVERY
    </span>

    <span th:if="${order.status=='DELIVERED'}"
          class="badge bg-success">
        DELIVERED
    </span>

    <span th:if="${order.status=='CANCELLED'}"
          class="badge bg-danger">
        CANCELLED
    </span>

</td>

<td th:text="${order.paymentMethod}"></td>

<td>

<span
th:if="${order.paymentStatus=='PAID'}"
class="badge bg-success">

PAID

</span>

<span
th:if="${order.paymentStatus=='PENDING'}"
class="badge bg-warning text-dark">

PENDING

</span>

<span
th:if="${order.paymentStatus==null}"
class="badge bg-secondary">

N/A

</span>

</td>

<td>

<a
th:href="@{'/invoice/' + ${order.id}}"
class="btn btn-primary btn-sm">

View Invoice

</a>

</td>

<td>

<a
th:href="@{'/track-order/' + ${order.id}}"
class="btn btn-success btn-sm">

Track Order

</a>

</td>

</tr>

</tbody>

</table>

</div>

</body>

</html>
