<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Checkout</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2>Checkout</h2>

<form
th:action="@{/place-order}"
th:object="${order}"
method="post">

<div class="mb-3">

<label>Name</label>

<input
type="text"
th:field="*{customerName}"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Mobile</label>

<input
type="text"
th:field="*{mobile}"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
th:field="*{email}"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Address</label>

<textarea
th:field="*{address}"
class="form-control"
required></textarea>

</div>

<h4>

Grand Total :

₹ <span th:text="${total}"></span>

</h4>

<div class="mb-3">

<label class="form-label">

<b>Select Payment Method</b>

</label>

<div class="form-check">

<input
class="form-check-input"
type="radio"
name="paymentMethod"
value="COD"
checked>

<label class="form-check-label">

Cash On Delivery

</label>

</div>

<div class="form-check">

<input
class="form-check-input"
type="radio"
name="paymentMethod"
value="ONLINE">

<label class="form-check-label">

Online Payment

</label>

</div>

</div>

<button
class="btn btn-success">

Place Order

</button>

</form>

</div>

</body>

</html>
