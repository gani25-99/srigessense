<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Secure Payment | SRIG ESSENSE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
          rel="stylesheet">

    <style>

        body{

            background:#f5f5f5;

        }

        .payment-card{

            max-width:700px;

            margin:50px auto;

            background:white;

            border-radius:15px;

            padding:35px;

            box-shadow:0 0 20px rgba(0,0,0,.15);

        }

        .payment-option{

            border:1px solid #ddd;

            border-radius:10px;

            padding:15px;

            margin-bottom:15px;

            cursor:pointer;

            transition:.3s;

        }

        .payment-option:hover{

            border-color:#0d6efd;

            background:#f8fbff;

        }

        .amount{

            font-size:28px;

            font-weight:bold;

            color:#198754;

        }

        .secure{

            color:#198754;

            font-size:14px;

            margin-top:15px;

        }

    </style>

</head>

<body>

<div class="container">

<div class="payment-card">

<h2 class="text-center mb-4">

<i class="fa-solid fa-credit-card"></i>

Secure Payment

</h2>

<hr>

<div class="row mb-4">

<div class="col-md-6">

<b>Order ID</b>

<p>

#<span th:text="${order.id}"></span>

</p>

</div>

<div class="col-md-6 text-end">

<b>Total Amount</b>

<p class="amount">

₹ <span th:text="${order.totalAmount}"></span>

</p>

</div>

</div>

<h5 class="mb-3">

Choose Payment Method

</h5>

<div class="payment-option">

<input
type="radio"
checked>

<i class="fa-solid fa-mobile-screen-button"></i>

UPI Payment

</div>

<div class="payment-option">

<input
type="radio">

<i class="fa-solid fa-credit-card"></i>

Credit / Debit Card

</div>

<div class="payment-option">

<input
type="radio">

<i class="fa-solid fa-building-columns"></i>

Net Banking

</div>

<div class="payment-option">

<input
type="radio">

<i class="fa-solid fa-wallet"></i>

Wallet

</div>

<div class="payment-option">

<input
type="radio">

<i class="fa-solid fa-qrcode"></i>

QR Code

</div>

<p class="secure">

<i class="fa-solid fa-lock"></i>

Your payment is protected with 256-bit SSL encryption.

</p>

<form
th:action="@{/payment/success/{id}(id=${order.id})}"
method="post">

<button
class="btn btn-success w-100 mt-4">

<i class="fa-solid fa-circle-check"></i>

Pay Now

</button>

</form>

<a
th:href="@{/payment/failed/{id}(id=${order.id})}"
class="btn btn-outline-danger w-100 mt-3">

Cancel Payment

</a>

</div>

</div>

</body>

</html>
