<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center mb-5">

        📊 Admin Dashboard

    </h1>

    <div class="row">

        <!-- Products -->

        <div class="col-md-4 mb-4">

            <div class="card shadow text-center">

                <div class="card-body">

                    <h5>Total Products</h5>

                    <h2 class="text-primary"
                        th:text="${products}">

                    </h2>

                </div>

            </div>

        </div>

        <!-- Categories -->

        <div class="col-md-4 mb-4">

            <div class="card shadow text-center">

                <div class="card-body">

                    <h5>Total Categories</h5>

                    <h2 class="text-success"
                        th:text="${categories}">

                    </h2>

                </div>

            </div>

        </div>

        <!-- Users -->

        <div class="col-md-4 mb-4">

            <div class="card shadow text-center">

                <div class="card-body">

                    <h5>Total Users</h5>

                    <h2 class="text-warning"
                        th:text="${users}">

                    </h2>

                </div>

            </div>

        </div>

        <!-- Orders -->

        <div class="col-md-6 mb-4">

            <div class="card shadow text-center">

                <div class="card-body">

                    <h5>Total Orders</h5>

                    <h2 class="text-danger"
                        th:text="${orders}">

                    </h2>

                </div>

            </div>

        </div>

        <!-- Revenue -->

        <div class="col-md-6 mb-4">

            <div class="card shadow text-center">

                <div class="card-body">

                    <h5>Total Revenue</h5>

                    <h2 class="text-success">

                        ₹ <span th:text="${revenue}"></span>

                    </h2>

                </div>

            </div>

        </div>

    </div>

    <hr>

    <div class="text-center mt-4">

        <a href="/admin/products"
           class="btn btn-primary me-2">

            Product Management

        </a>

        <a href="/admin/orders"
           class="btn btn-success me-2">

            Order Management

        </a>

        <a href="/home"
           class="btn btn-dark">

            Customer Home

        </a>

    </div>

</div>

</body>

</html>
