<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="text-center mb-5">

SRIG ESSENSE Admin Dashboard

</h2>

<div class="row g-4">

<div class="col-md-3">
<a href="/admin/categories" class="btn btn-primary w-100 p-4">
<i class="fa-solid fa-list fa-2x"></i>
<br><br>
Categories
</a>
</div>

<div class="col-md-3">
<a href="/admin/sub-categories" class="btn btn-success w-100 p-4">
<i class="fa-solid fa-layer-group fa-2x"></i>
<br><br>
Sub Categories
</a>
</div>

<div class="col-md-3">
<a href="/admin/products" class="btn btn-warning w-100 p-4">
<i class="fa-solid fa-shirt fa-2x"></i>
<br><br>
Products
</a>
</div>

<div class="col-md-3">
<a href="/admin/orders" class="btn btn-danger w-100 p-4">
<i class="fa-solid fa-box fa-2x"></i>
<br><br>
Orders
</a>
</div>

<div class="col-md-3">
<a href="/admin/customers" class="btn btn-info w-100 p-4">
<i class="fa-solid fa-users fa-2x"></i>
<br><br>
Customers
</a>
</div>

<div class="col-md-3">
<a href="/admin/reviews" class="btn btn-secondary w-100 p-4">
<i class="fa-solid fa-star fa-2x"></i>
<br><br>
Reviews
</a>
</div>

<div class="col-md-3">
<a href="/admin/reports" class="btn btn-dark w-100 p-4">
<i class="fa-solid fa-chart-column fa-2x"></i>
<br><br>
Reports
</a>
</div>

<div class="col-md-3">
<a href="/logout" class="btn btn-outline-danger w-100 p-4">
<i class="fa-solid fa-right-from-bracket fa-2x"></i>
<br><br>
Logout
</a>
</div>

</div>

</div>

</body>

</html>
