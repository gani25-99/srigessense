<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<title>Track Order</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

body{
    background:#f5f5f5;
}

.order-card{
    background:white;
    border-radius:10px;
    padding:30px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.timeline{

    position:relative;
    margin-top:40px;
    margin-left:25px;

}

.timeline::before{

    content:'';
    position:absolute;

    left:14px;
    top:0;

    width:4px;
    height:100%;

    background:#dee2e6;

}

.step{

    position:relative;

    padding-left:45px;

    margin-bottom:35px;

}

.step::before{

    content:'';

    position:absolute;

    left:5px;
    top:4px;

    width:20px;
    height:20px;

    border-radius:50%;

    background:#198754;

}

.pending::before{

    background:#adb5bd;

}

.step h5{

    margin-bottom:5px;

}

.summary{

    background:#f8f9fa;
    border-radius:8px;
    padding:20px;

}

</style>

</head>

<body>

<div class="container mt-5">

<div class="order-card">

<h2>

Track Order #

<span th:text="${order.id}"></span>

</h2>

<hr>

<div class="summary">

<div class="row">

<div class="col-md-4">

<b>Status</b>

<p>

<span class="badge bg-primary"
th:text="${order.status}"></span>

</p>

</div>

<div class="col-md-4">

<b>Payment</b>

<p th:text="${order.paymentMethod}"></p>

</div>

<div class="col-md-4">

<b>Payment Status</b>

<p>

<span class="badge bg-success"
th:if="${order.paymentStatus=='PAID'}">

PAID

</span>

<span class="badge bg-warning text-dark"
th:if="${order.paymentStatus=='PENDING'}">

PENDING

</span>

</p>

</div>

</div>

<div class="row mt-3">

<div class="col-md-6">

<b>Estimated Delivery</b>

<p
th:text="${#temporals.format(order.expectedDeliveryDate,'dd MMM yyyy')}">
</p>

</div>

<div class="col-md-6">

<b>Order Total</b>

<p>

₹ <span th:text="${order.totalAmount}"></span>

</p>

</div>

</div>

</div>

<div class="timeline">

<div class="step">

<h5>✅ Order Placed</h5>

<p
th:text="${#temporals.format(order.placedAt,'dd MMM yyyy hh:mm a')}">
</p>

</div>

<div class="step"
th:classappend="${order.confirmedAt==null}? 'pending'">

<h5>✅ Order Confirmed</h5>

<p
th:if="${order.confirmedAt!=null}"
th:text="${#temporals.format(order.confirmedAt,'dd MMM yyyy hh:mm a')}">
</p>

</div>

<div class="step"
th:classappend="${order.packedAt==null}? 'pending'">

<h5>📦 Packed</h5>

<p
th:if="${order.packedAt!=null}"
th:text="${#temporals.format(order.packedAt,'dd MMM yyyy hh:mm a')}">
</p>

</div>

<div class="step"
th:classappend="${order.shippedAt==null}? 'pending'">

<h5>🚚 Shipped</h5>

<p
th:if="${order.shippedAt!=null}"
th:text="${#temporals.format(order.shippedAt,'dd MMM yyyy hh:mm a')}">
</p>

</div>

<div class="step"
th:classappend="${order.outForDeliveryAt==null}? 'pending'">

<h5>🏠 Out For Delivery</h5>

<p
th:if="${order.outForDeliveryAt!=null}"
th:text="${#temporals.format(order.outForDeliveryAt,'dd MMM yyyy hh:mm a')}">
</p>

</div>

<div class="step"
th:classappend="${order.deliveredAt==null}? 'pending'">

<h5>🎉 Delivered</h5>

<p
th:if="${order.deliveredAt!=null}"
th:text="${#temporals.format(order.deliveredAt,'dd MMM yyyy hh:mm a')}">
</p>

</div>

</div>

<div class="mt-4">

<a href="/my-orders"
class="btn btn-primary">

← Back to My Orders

</a>

</div>

</div>

</div>

</body>

</html>
