
<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile | SRIG ESSENSE</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
          rel="stylesheet">

    <!-- Dashboard CSS -->

    <link rel="stylesheet"
          th:href="@{/css/dashboard.css}">

    <style>

        /* =========================
           PROFILE IMAGE
        ========================= */

        .profile-image-wrapper {

            width: 150px;
            height: 150px;

            margin: 0 auto 15px;

            border-radius: 50%;

            overflow: hidden;

            border: 4px solid #f1f1f1;

            background: #f8f9fa;

            display: flex;

            align-items: center;

            justify-content: center;

        }

        .profile-image {

            width: 100%;
            height: 100%;

            object-fit: cover;

        }

        .image-upload-label {

            cursor: pointer;

        }

    </style>

</head>


<body>


<!-- =========================
     SIDEBAR
========================= -->

<aside class="sidebar">

    <div class="brand">

        <img src="/images/srig-logo.png"
             class="brand-logo"
             alt="SRIG ESSENSE">

        <h2>SRIG ESSENSE</h2>

    </div>


    <ul class="menu">

        <li>

            <a href="/home">

                <i class="fa-solid fa-house"></i>

                Dashboard

            </a>

        </li>


        <li>

            <a href="/profile"
               class="active">

                <i class="fa-solid fa-user"></i>

                My Profile

            </a>

        </li>


        <li>

            <a href="/my-orders">

                <i class="fa-solid fa-box"></i>

                My Orders

            </a>

        </li>


        <li>

            <a href="/wishlist">

                <i class="fa-solid fa-heart"></i>

                Wishlist

            </a>

        </li>


        <li>

            <a href="/cart">

                <i class="fa-solid fa-cart-shopping"></i>

                Cart

            </a>

        </li>


        <li>

            <a href="/change-password">

                <i class="fa-solid fa-lock"></i>

                Change Password

            </a>

        </li>


        <li>

            <a href="/logout">

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </a>

        </li>

    </ul>

</aside>



<!-- =========================
     MAIN CONTENT
========================= -->

<main class="main-content">


    <!-- HEADER -->

    



    <!-- PROFILE CARD -->

    <div class="card shadow p-4 rounded-4">


        <!-- SUCCESS MESSAGE -->

        <div th:if="${message}"
             class="alert alert-success">

            <i class="fa-solid fa-circle-check me-2"></i>

            <span th:text="${message}"></span>

        </div>



        <!-- PROFILE FORM -->

        <form action="/profile/update"
              method="post"
              enctype="multipart/form-data">


            <!-- =========================
                 PROFILE IMAGE
            ========================= -->

            <div class="text-center mb-4">

                <div class="profile-image-wrapper">


                    <!-- Existing Image -->

                    <img th:if="${user.profileImage != null}"
                         th:src="@{'/profile/' + ${user.profileImage}}"
                         class="profile-image"
                         alt="Profile Image">


                    <!-- Default Image -->

                    <img th:unless="${user.profileImage != null}"
                         src="/images/logo3.png"
                         class="profile-image"
                         alt="Default Profile Image">

                </div>


                <label class="btn btn-outline-dark image-upload-label">

                    <i class="fa-solid fa-camera me-2"></i>

                    Choose Profile Image

                    <input type="file"
                           name="image"
                           accept="image/*"
                           hidden>

                </label>


                <div class="text-muted small mt-2">

                    JPG, PNG or WEBP · Maximum 10MB

                </div>

            </div>



            <!-- =========================
                 NAME
            ========================= -->

            <div class="mb-3">

                <label class="form-label">

                    Full Name

                </label>

                <input
                        type="text"
                        name="name"
                        class="form-control"
                        th:value="${user.name}"
                        required>

            </div>



            <!-- =========================
                 EMAIL
            ========================= -->

            <div class="mb-3">

                <label class="form-label">

                    Email Address

                </label>

                <input
                        type="email"
                        name="email"
                        class="form-control"
                        th:value="${user.email}"
                        required>

            </div>



            <!-- =========================
                 MOBILE
            ========================= -->

            <div class="mb-3">

                <label class="form-label">

                    Mobile Number

                </label>

                <input
                        type="text"
                        class="form-control"
                        th:value="${user.mobile}"
                        readonly>

            </div>



            <!-- =========================
                 ADDRESS
            ========================= -->

            <div class="mb-4">

                <label class="form-label">

                    Address

                </label>

                <textarea
                        name="address"
                        class="form-control"
                        rows="4"
                        th:text="${user.address}"></textarea>

            </div>



            <!-- =========================
                 BUTTONS
            ========================= -->

            <button
                    type="submit"
                    class="btn btn-primary">

                <i class="fa-solid fa-floppy-disk me-2"></i>

                Update Profile

            </button>


            <a href="/home"
               class="btn btn-secondary ms-2">

                <i class="fa-solid fa-arrow-left me-2"></i>

                Back to Dashboard

            </a>


        </form>

    </div>

</main>



<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
