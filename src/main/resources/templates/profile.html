<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>My Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        .profile-img{
            width:150px;
            height:150px;
            border-radius:50%;
            object-fit:cover;
            border:3px solid #0d6efd;
        }
    </style>

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h3>My Profile</h3>
                </div>

                <div class="card-body">

                    <div class="alert alert-success"
                         th:if="${success}"
                         th:text="${success}">
                    </div>

                    <form th:action="@{/profile}"
                          method="post"
                          enctype="multipart/form-data">

                        <div class="text-center mb-4">

    <img th:if="${user.profileImage != null}"
         th:src="@{'/images/profile/' + ${user.profileImage}}"
         class="profile-img">

    <img th:if="${user.profileImage == null}"
         th:src="@{/images/profile/default.png}"
         class="profile-img">

    <!-- Temporary debug -->
    <p class="mt-2 text-danger" th:text="${user.profileImage}"></p>

</div>

                        <div class="mb-3">
                            <label class="form-label">Profile Photo</label>
                            <input type="file"
                                   name="image"
                                   class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text"
                                   name="name"
                                   class="form-control"
                                   th:value="${user.name}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mobile</label>
                            <input type="text"
                                   class="form-control"
                                   th:value="${user.mobile}"
                                   readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   th:value="${user.email}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea name="address"
                                      class="form-control"
                                      rows="3"
                                      th:text="${user.address}"></textarea>
                        </div>

                        <button type="submit"
                                class="btn btn-primary w-100">
                            Update Profile
                        </button>

                    </form>

                    <div class="mt-3 text-center">
                        <a href="/dashboard">Back to Dashboard</a>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
