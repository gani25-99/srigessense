<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Email Verification | SRIG ESSENSE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/auth.css}">

</head>

<body>

<div class="auth-container">

    <!-- LEFT PANEL -->

    <div class="left-panel">

        <div class="overlay">

            <img src="/images/logo.png"
                 class="brand-logo"
                 alt="Logo">

            <h1>

                SRIG ESSENSE

            </h1>

            <h4>

                Email Verification

            </h4>

            <p>

                Verify your email address
                to continue login.

            </p>

        </div>

    </div>

    <!-- RIGHT PANEL -->

    <div class="right-panel">

        <div class="auth-card">

            <div class="text-center mb-4">

                <img src="/images/logo.png"
                     class="logo"
                     alt="Logo">

                <h2>

                    Verify Email OTP

                </h2>

                <p class="text-muted">

                    Enter the 6-digit OTP sent to your registered email.

                </p>

            </div>

            <!-- Error Message -->

            <div th:if="${error}"
                 class="alert alert-danger text-center">

                <span th:text="${error}"></span>

            </div>

            <!-- Success Message -->

            <div th:if="${message}"
                 class="alert alert-success text-center">

                <span th:text="${message}"></span>

            </div>

            <!-- OTP FORM -->

            <form action="/login/verify-email-otp"
                  method="post">

                <input
                        type="hidden"
                        name="email"
                        th:value="${email}">

                <div class="input-box">

                    <i class="fa-solid fa-envelope-open-text"></i>

                    <input
                            type="text"
                            name="otp"
                            maxlength="6"
                            placeholder="Enter 6 Digit OTP"
                            required>

                </div>

                <button
                        type="submit"
                        class="primary-btn">

                    VERIFY OTP

                </button>

            </form>

            <!-- RESEND OTP -->

            <div class="signup-link mt-4">

                <p>

                    Didn't receive OTP?

                </p>

                <form action="/login/resend-email-otp"
                      method="post">

                    <input
                            type="hidden"
                            name="email"
                            th:value="${email}">

                    <button
                            type="submit"
                            class="btn btn-link p-0">

                        Resend OTP

                    </button>

                </form>

            </div>

            <!-- BACK -->

            <div class="signup-link">

                <a href="/login">

                    ← Back to Login

                </a>

            </div>

        </div>

    </div>

</div>

<script th:src="@{/js/auth.js}"></script>

</body>

</html>
