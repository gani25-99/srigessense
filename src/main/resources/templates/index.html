<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SRIG</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f5f5f5;
            min-height:100vh;
            display:flex;
            align-items:center;
        }

        .login-box{
            max-width:950px;
            width:100%;
            margin:auto;
            background:white;
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 5px 20px rgba(0,0,0,.2);
        }

        .left{
            background:#eee;
            min-height:500px;
        }

        .left img{
            width:100%;
            height:100%;
            object-fit:cover;
        }

        .right{
            padding:60px;
            display:flex;
            flex-direction:column;
            justify-content:center;
        }

        .otp-btn{
            width:100%;
            height:55px;
            background:black;
            color:white;
            border:none;
            font-size:20px;
            font-weight:bold;
            border-radius:8px;
            transition:.3s;
        }

        .otp-btn:hover{
            background:#333;
        }

        @media(max-width:768px){

            .login-box{
                margin:15px;
            }

            .left{
                min-height:220px;
            }

            .right{
                padding:25px;
            }

            h1{
                font-size:28px;
            }

            .otp-btn{
                font-size:18px;
                height:50px;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <div class="row login-box g-0">

        <div class="col-lg-7 col-md-6 col-12 left">

            <img src="/images/login-banner.jpg"
                 class="img-fluid"
                 alt="Login Banner">

        </div>

        <div class="col-lg-5 col-md-6 col-12 right">

            <h1 class="fw-bold mb-3">
                SRIG OWN YOUR STYLE
            </h1>

            <p class="text-muted mb-4">
                Unlock coupons, profile and much more
            </p>

            <form action="/send-otp" method="post">

                <div class="mb-4">

                    <input
                            type="tel"
                            name="mobile"
                            class="form-control form-control-lg"
                            placeholder="Enter Mobile Number"
                            pattern="[0-9]{10}"
                            maxlength="10"
                            required>

                </div>

                <button type="submit" class="otp-btn">
                    SEND OTP
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
