<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>SRIG</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{

            background:#f5f5f5;

        }

        .login-box{

            width:950px;

            margin:60px auto;

            background:white;

            border-radius:10px;

            overflow:hidden;

            box-shadow:0 5px 20px rgba(0,0,0,.2);

        }

        .left{

            background:#eee;

            height:500px;

        }

        .left img{

            width:100%;

            height:100%;

            object-fit:cover;

        }

        .right{

            padding:60px;

        }

        .otp-btn{

            background:black;

            color:white;

            width:100%;

            height:55px;

            border:none;

            font-size:20px;

            font-weight:bold;

        }

        .otp-btn:hover{

            background:#333;

        }

    </style>

</head>

<body>

<div class="container">

    <div class="row login-box">

        <!-- Left Image -->

        <div class="col-md-7 left">

            <img src="/images/login-banner.jpg" alt="login-banner.jpg" width="150">

        </div>

        <!-- Right Login -->

        <div class="col-md-5 right">

            <h1 class="fw-bold">

                SRIG OWN YOUR STYLE

            </h1>

            <p class="text-muted">

                Unlock coupons, profile and much more

            </p>

            <form action="/send-otp" method="post">

                <div class="mb-4">

                    <input
                            type="text"
                            name="mobile"
                            class="form-control form-control-lg"
                            placeholder="+91 Enter Mobile Number"
                            required>

                </div>

                <button class="otp-btn">

                    SEND OTP

                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
