<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Contact Us</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
    background:#f5f5f5;
}

.contact-card{

    max-width:750px;
    margin:40px auto;
    border:none;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
}

.card-header{

    background:#0d6efd;
    color:white;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    padding:20px;
}

.btn-send{

    width:100%;
    font-size:18px;
}

.required{

    color:red;
}

.text-danger{

    font-size:14px;
}

</style>

</head>

<body>

<div class="container">

<div class="card contact-card">

<div class="card-header">

<i class="fa-solid fa-envelope"></i>

Contact Us

</div>

<div class="card-body">

<div th:if="${success}"
class="alert alert-success"
th:text="${success}">
</div>

<form
th:action="@{/contact}"
th:object="${contact}"
method="post">

<div class="mb-3">

<label class="form-label">

Name

<span class="required">*</span>

</label>

<input
type="text"
class="form-control"
th:field="*{name}"
placeholder="Enter your name">

<div class="text-danger"
th:errors="*{name}">
</div>

</div>

<div class="mb-3">

<label class="form-label">

Email

<span class="required">*</span>

</label>

<input
type="email"
class="form-control"
th:field="*{email}"
placeholder="Enter your email">

<div class="text-danger"
th:errors="*{email}">
</div>

</div>

<div class="mb-3">

<label class="form-label">

Mobile

<span class="required">*</span>

</label>

<input
type="text"
class="form-control"
th:field="*{mobile}"
placeholder="Enter mobile number">

<div class="text-danger"
th:errors="*{mobile}">
</div>

</div>

<div class="mb-3">

<label class="form-label">

Subject

<span class="required">*</span>

</label>

<input
type="text"
class="form-control"
th:field="*{subject}"
placeholder="Enter subject">

<div class="text-danger"
th:errors="*{subject}">
</div>

</div>

<div class="mb-3">

<label class="form-label">

Message

<span class="required">*</span>

</label>

<textarea
class="form-control"
rows="6"
th:field="*{message}"
placeholder="Write your message here...">
</textarea>

<div class="text-danger"
th:errors="*{message}">
</div>

</div>

<button
type="submit"
class="btn btn-primary btn-send">

<i class="fa-solid fa-paper-plane"></i>

Send Message

</button>

</form>

</div>

</div>

</div>

</body>

</html>
