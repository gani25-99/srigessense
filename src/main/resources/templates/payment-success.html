<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Payment Successful | SRIG ESSENSE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
          rel="stylesheet">

    <style>

        body{

            background:#f5f5f5;

        }

        .success-card{

            max-width:700px;

            margin:60px auto;

            background:white;

            border-radius:15px;

            padding:40px;

            box-shadow:0 0 20px rgba(0,0,0,.15);

            text-align:center;

        }

        .icon{

            font-size:80px;

            color:#198754;

            margin-bottom:20px;

        }

        .amount{

            font-size:28px;

            font-weight:bold;

            color:#198754;

        }

        table{

            margin-top:25px;

        }

    </style>

</head>

<body>

<div class="container">

<div class="success-card">

<i class="fa-solid fa-circle-check icon"></i>

<h2 class="text-success">

    Payment Successful

</h2>

<p>

    Your payment has been processed successfully.

</p>

<hr>

<table class="table table-bordered">

    <tr>

        <th>Order ID</th>

        <td>

            #<span th:text="${order.id}"></span>

        </td>

    </tr>

    <tr>

        <th>Customer</th>

        <td th:text="${order.customerName}"></td>

    </tr>

    <tr>

        <th>Transaction ID</th>

        <td th:text="${order.transactionId}"></td>

    </tr>

    <tr>

        <th>Payment Method</th>

        <td th:text="${order.paymentMethod}"></td>

    </tr>

    <tr>

        <th>Payment Status</th>

        <td>

            <span class="badge bg-success"
                  th:text="${order.paymentStatus}"></span>

        </td>

    </tr>

    <tr>

        <th>Total Amount</th>

        <td class="amount">

            ₹ <span th:text="${order.totalAmount}"></span>

        </td>

    </tr>

</table>

<div class="mt-4">

    <a th:href="@{/invoice/pdf/{id}(id=${order.id})}"
       class="btn btn-primary me-2">

        <i class="fa-solid fa-file-pdf"></i>

        Download Invoice

    </a>

    <a th:href="@{/track-order/{id}(id=${order.id})}"
       class="btn btn-success me-2">

        <i class="fa-solid fa-truck"></i>

        Track Order

    </a>

    <a href="/home"
       class="btn btn-dark">

        <i class="fa-solid fa-house"></i>

        Continue Shopping

    </a>

</div>

</div>

</div>

</body>

</html>
