<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin Orders | SRIG ESSENSE</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      th:href="@{/css/dashboard.css}">

</head>

<body>

<div class="dashboard-container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="brand">

            <img src="/images/logo3.png"
                 class="brand-logo">

            <h2>

                SRIG ESSENSE

            </h2>

            <small>Admin Panel</small>

        </div>

        <ul class="menu">

            <li>

                <a href="/admin/dashboard">

                    <i class="fa-solid fa-gauge"></i>

                    Dashboard

                </a>

            </li>

            <li>

                <a href="/admin/products">

                    <i class="fa-solid fa-box"></i>

                    Products

                </a>

            </li>

            <li>

                <a href="/admin/orders"
                   class="active">

                    <i class="fa-solid fa-cart-shopping"></i>

                    Orders

                </a>

            </li>

            <li>

                <a href="/admin/customers">

                    <i class="fa-solid fa-users"></i>

                    Customers

                </a>

            </li>

            <li>

                <a href="/logout">

                    <i class="fa-solid fa-right-from-bracket"></i>

                    Logout

                </a>

            </li>

        </ul>

    </aside>

    <!-- Main -->

    <main class="main-content">

        <div class="welcome-card">

            <h2>

                Order Management

            </h2>

            <p>

                View and manage customer orders.

            </p>

        </div>

        <div class="card shadow">

            <div class="card-body">

                <table class="table table-bordered table-hover align-middle">

                    <thead class="table-dark">

                    <tr>

                        <th>Order ID</th>

                        <th>Customer</th>

                        <th>Email</th>

                        <th>Mobile</th>

                        <th>Total</th>

                        <th>Payment</th>

                        <th>Status</th>

                        <th>Placed On</th>

                        <th>Action</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="order : ${orders}">

                        <td>

                            #<span th:text="${order.id}"></span>

                        </td>

                        <td th:text="${order.customerName}"></td>

                        <td th:text="${order.email}"></td>

                        <td th:text="${order.mobile}"></td>

                        <td>

                            ₹

                            <span th:text="${order.totalAmount}"></span>

                        </td>

                        <td>

                            <span class="badge"

                                  th:classappend="${order.paymentStatus=='Paid'} ? 'bg-success' : 'bg-warning text-dark'"

                                  th:text="${order.paymentStatus}">

                            </span>

                        </td>

                        <td>

                            <span class="badge"

                                  th:classappend="
${order.status=='Pending'} ? 'bg-warning text-dark' :
${order.status=='Confirmed'} ? 'bg-primary' :
${order.status=='Packed'} ? 'bg-info text-dark' :
${order.status=='Shipped'} ? 'bg-secondary' :
${order.status=='Out For Delivery'} ? 'bg-dark' :
${order.status=='Delivered'} ? 'bg-success' :
'bg-danger'"

                                  th:text="${order.status}">

                            </span>

                        </td>

                        <td th:text="${order.placedAt}"></td>

                        <td>

                            <a

                                    th:href="@{/admin/orders/{id}(id=${order.id})}"

                                    class="btn btn-primary btn-sm">

                                <i class="fa-solid fa-eye"></i>

                                View

                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>

</body>

</html>
