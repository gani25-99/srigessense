<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Admin Orders</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2 class="mb-4">Admin Orders</h2>

<table class="table table-bordered table-hover align-middle">

<thead class="table-dark">

<tr>

<th>Order ID</th>
<th>Customer</th>
<th>Mobile</th>
<th>Total</th>
<th>Payment</th>
<th>Payment Status</th>
<th>Manage Order</th>

</tr>

</thead>

<tbody>

<tr th:each="order : ${orders}">

<td th:text="${order.id}"></td>

<td th:text="${order.customerName}"></td>

<td th:text="${order.mobile}"></td>

<td>
₹ <span th:text="${order.totalAmount}"></span>
</td>

<td th:text="${order.paymentMethod}"></td>

<td>

<span class="badge bg-success"
      th:if="${order.paymentStatus=='PAID'}">
PAID
</span>

<span class="badge bg-warning text-dark"
      th:if="${order.paymentStatus=='PENDING'}">
PENDING
</span>

<span class="badge bg-secondary"
      th:if="${order.paymentStatus==null}">
N/A
</span>

</td>

<td>

<form th:action="@{/admin/orders/update}" method="post">

<input type="hidden"
       name="id"
       th:value="${order.id}"/>

<div class="mb-2">

<label class="form-label fw-bold">
Status
</label>

<select name="status"
        class="form-select form-select-sm">

<option value="PLACED"
th:selected="${order.status=='PLACED'}">
PLACED
</option>

<option value="CONFIRMED"
th:selected="${order.status=='CONFIRMED'}">
CONFIRMED
</option>

<option value="PACKED"
th:selected="${order.status=='PACKED'}">
PACKED
</option>

<option value="SHIPPED"
th:selected="${order.status=='SHIPPED'}">
SHIPPED
</option>

<option value="OUT FOR DELIVERY"
th:selected="${order.status=='OUT FOR DELIVERY'}">
OUT FOR DELIVERY
</option>

<option value="DELIVERED"
th:selected="${order.status=='DELIVERED'}">
DELIVERED
</option>

<option value="CANCELLED"
th:selected="${order.status=='CANCELLED'}">
CANCELLED
</option>

</select>

</div>

<div class="mb-2">

<label class="form-label fw-bold">
Courier Name
</label>

<input
type="text"
name="courierName"
class="form-control form-control-sm"
placeholder="Delhivery"
th:value="${order.courierName}"/>

</div>

<div class="mb-2">

<label class="form-label fw-bold">
Tracking Number
</label>

<input
type="text"
name="trackingNumber"
class="form-control form-control-sm"
placeholder="DL123456789"
th:value="${order.trackingNumber}"/>

</div>

<button
type="submit"
class="btn btn-primary btn-sm">

Update Order

</button>

<a
th:if="${order.paymentMethod=='COD' && order.paymentStatus=='PENDING'}"
th:href="@{'/admin/payment/' + ${order.id}}"
class="btn btn-success btn-sm mt-2">

Mark Paid

</a>

</form>

</td>

</tr>

</tbody>

</table>

</div>

</body>

</html>
