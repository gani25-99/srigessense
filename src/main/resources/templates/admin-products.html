<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Products | SRIG ESSENSE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">

        Product Management

    </h2>

    <!-- ==========================
         PRODUCT FORM
    =========================== -->

    <form id="productForm"
          enctype="multipart/form-data">

        <input type="hidden"
               id="productId"
               name="id">

        <div class="row">

            <!-- Product Name -->

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Product Name

                </label>

                <input
                        type="text"
                        class="form-control"
                        name="name"
                        required>

            </div>

            <!-- Category -->

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Category

                </label>

                <select
                        class="form-select"
                        id="categoryId"
                        name="categoryId"
                        required>

                    <option value="">

                        Select Category

                    </option>

                </select>

            </div>

        </div>

        <!-- Category & Sub Category -->

        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Sub Category

                </label>

                <select
                        class="form-select"
                        id="subcategoryId"
                        name="subcategoryId"
                        required>

                    <option value="">

                        Select Sub Category

                    </option>

                </select>

            </div>

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Price

                </label>

                <input
                        type="number"
                        class="form-control"
                        name="price"
                        required>

            </div>

        </div>

        <!-- Description -->

        <div class="mb-3">

            <label class="form-label">

                Description

            </label>

            <textarea
                    class="form-control"
                    name="description"
                    rows="3"></textarea>

        </div>

        <!-- Quantity & Image -->

        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Quantity

                </label>

                <input
                        type="number"
                        class="form-control"
                        name="quantity"
                        required>

            </div>

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Product Image

                </label>

                <input
                        type="file"
                        class="form-control"
                        name="image"
                        required>

            </div>

        </div>

        <button class="btn btn-primary w-100">

            Save Product

        </button>

    </form>

    <hr>

    <!-- ==========================
         SEARCH
    =========================== -->

    <div class="row mb-3">

        <div class="col-md-6">

            <input
                    type="text"
                    id="search"
                    class="form-control"
                    placeholder="Search Product...">

        </div>

    </div>

    <!-- ==========================
         PRODUCT LIST
    =========================== -->

    <h3 class="mt-4">

        Products

    </h3>

    <div id="products"
         class="row">

    </div>

</div>

<!-- ==========================
     JAVASCRIPT
=========================== -->

<script th:src="@{/js/admin.js}"></script>

</body>

</html>
