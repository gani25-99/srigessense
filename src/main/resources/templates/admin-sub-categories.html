<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin | Sub Categories</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/dashboard.css}">

</head>

<body>

<div class="dashboard-container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="brand">

            <img src="/images/logo3.png"
                 class="brand-logo">

            <h2>

                SRIG ESSENSE

            </h2>

        </div>

        <ul class="menu">

            <li>

                <a href="/admin/dashboard">

                    <i class="fa-solid fa-chart-line"></i>

                    Dashboard

                </a>

            </li>

            <li>

                <a href="/admin/categories">

                    <i class="fa-solid fa-list"></i>

                    Categories

                </a>

            </li>

            <li>

                <a href="/admin/sub-categories"
                   class="active">

                    <i class="fa-solid fa-layer-group"></i>

                    Sub Categories

                </a>

            </li>

            <li>

                <a href="/admin/products">

                    <i class="fa-solid fa-shirt"></i>

                    Products

                </a>

            </li>

            <li>

                <a href="/logout">

                    <i class="fa-solid fa-right-from-bracket"></i>

                    Logout

                </a>

            </li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="main-content">

        <div class="welcome-card">

            <h2>

                Sub Category Management

            </h2>

            <p>

                Add and manage men's fashion sub categories.

            </p>

        </div>

        <!-- Search -->

        <form class="row mb-4"
              action="/admin/sub-categories/search"
              method="get">

            <div class="col-md-10">

                <input
                        type="text"
                        name="keyword"
                        class="form-control"
                        placeholder="Search Sub Category">

            </div>

            <div class="col-md-2">

                <button
                        class="btn btn-primary w-100">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    Search

                </button>

            </div>

        </form>

        <!-- Add Form -->

        <div class="card shadow mb-4">

            <div class="card-header bg-primary text-white">

                Add Sub Category

            </div>

            <div class="card-body">

                <form
                        action="/admin/sub-categories/save"
                        method="post">

                    <div class="row">

                        <div class="col-md-4">

                            <label>

                                Category

                            </label>

                            <select
                                    name="categoryId"
                                    class="form-select"
                                    required>

                                <option value="">

                                    Select Category

                                </option>

                                <option
                                        th:each="category : ${categories}"
                                        th:value="${category.id}"
                                        th:text="${category.name}">
                                </option>

                            </select>

                        </div>

                        <div class="col-md-4">

                            <label>

                                Sub Category

                            </label>

                            <input
                                    type="text"
                                    name="name"
                                    class="form-control"
                                    placeholder="Enter Sub Category"
                                    required>

                        </div>

                        <div class="col-md-4">

                            <label>

                                Image

                            </label>

                            <input
                                    type="text"
                                    name="image"
                                    class="form-control"
                                    placeholder="Image filename">

                        </div>

                    </div>

                    <div class="mt-4">

                        <button
                                class="btn btn-success">

                            <i class="fa-solid fa-plus"></i>

                            Save Sub Category

                        </button>

                    </div>

                </form>

            </div>

        </div>
                <!-- Sub Category List -->

        <div class="card shadow">

            <div class="card-header bg-dark text-white">

                All Sub Categories

            </div>

            <div class="card-body">

                <table class="table table-bordered table-hover">

                    <thead class="table-light">

                    <tr>

                        <th>ID</th>

                        <th>Category</th>

                        <th>Sub Category</th>

                        <th>Image</th>

                        <th>Status</th>

                        <th>Actions</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr
                        th:each="sub : ${subCategories}">

                        <td
                            th:text="${sub.id}">
                        </td>

                        <td
                            th:text="${sub.category.name}">
                        </td>

                        <td
                            th:text="${sub.name}">
                        </td>

                        <td>

                            <img
                                th:if="${sub.image != null}"
                                th:src="@{'/images/' + ${sub.image}}"
                                width="70"
                                height="70"
                                class="rounded">

                            <span
                                th:if="${sub.image == null}">

                                No Image

                            </span>

                        </td>

                        <td>

                            <span
                                th:if="${sub.active}"
                                class="badge bg-success">

                                Active

                            </span>

                            <span
                                th:unless="${sub.active}"
                                class="badge bg-danger">

                                Inactive

                            </span>

                        </td>

                        <td>

                            <a
                               th:href="@{/admin/sub-categories/edit/{id}(id=${sub.id})}"
                               class="btn btn-warning btn-sm">

                                <i class="fa-solid fa-pen"></i>

                            </a>

                            <a
                               th:href="@{/admin/sub-categories/delete/{id}(id=${sub.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Delete this Sub Category?');">

                                <i class="fa-solid fa-trash"></i>

                            </a>

                        </td>

                    </tr>

                    <tr
                        th:if="${#lists.isEmpty(subCategories)}">

                        <td
                            colspan="6"
                            class="text-center text-muted">

                            No Sub Categories Found

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>

</body>

</html>
