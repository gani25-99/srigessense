<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title th:text="${product.name} + ' | SRIG ESSENSE'">
        Product Details
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
          rel="stylesheet">

    <style>

        body{

            background:#f8f9fa;

        }

        .product-card{

            background:#fff;

            border-radius:15px;

            padding:35px;

            box-shadow:0 5px 20px rgba(0,0,0,.1);

        }

        .product-image{

            width:100%;

            height:600px;

            object-fit:cover;

            border-radius:15px;

        }

        .price{

            font-size:34px;

            font-weight:bold;

            color:#198754;

        }

        .stock{

            color:#198754;

            font-weight:600;

        }

        .info-box{

            background:#f8f9fa;

            border-radius:10px;

            padding:15px;

        }

        .btn{

            border-radius:8px;

        }

        .feature{

            padding:12px;

            border-bottom:1px solid #eee;

        }

    </style>

</head>

<body>

<nav class="navbar navbar-light bg-white shadow-sm">

    <div class="container">

        <a href="/home"
           class="navbar-brand fw-bold">

            SRIG ESSENSE

        </a>

        <a href="/home"
           class="btn btn-outline-dark">

            ← Back

        </a>

    </div>

</nav>

<div class="container my-5">

    <div class="product-card">

        <div class="row">

            <!-- IMAGE -->

            <div class="col-lg-5">

                <img
                        th:src="@{'/products/' + ${product.image}}"
                        class="product-image"
                        onerror="this.src='/images/logo3.png'">

            </div>

            <!-- DETAILS -->

            <div class="col-lg-7">

                <h2 class="fw-bold"
                    th:text="${product.name}">
                </h2>

                <div class="mb-3">

                    ⭐⭐⭐⭐⭐

                    <span class="text-muted">

                        (4.8 Rating)

                    </span>

                </div>

                <div class="price">

                    ₹ <span th:text="${product.price}"></span>

                </div>

                <hr>

                <p class="lead"
                   th:text="${product.description}">
                </p>

                <div class="info-box mt-4">

                    <p>

                        <strong>Category :</strong>

                        <span
                                th:text="${product.category.name}">
                        </span>

                    </p>

                    <p>

                        <strong>Stock :</strong>

                        <span class="stock"
                              th:text="${product.quantity}">
                        </span>

                    </p>

                </div>

                <div class="mt-4">

                    <a
                            th:if="${product.quantity>0}"
                            th:href="@{/cart/add/{id}(id=${product.id})}"
                            class="btn btn-dark btn-lg">

                        <i class="fa-solid fa-cart-shopping"></i>

                        Add To Cart

                    </a>

                    <button
                            th:if="${product.quantity==0}"
                            class="btn btn-secondary btn-lg"
                            disabled>

                        Out Of Stock

                    </button>

                    <a
                            th:href="@{/wishlist/add/{id}(id=${product.id})}"
                            class="btn btn-outline-danger btn-lg ms-2">

                        <i class="fa-solid fa-heart"></i>

                        Wishlist

                    </a>

                    <a
                            th:href="@{/checkout/{id}(id=${product.id})}"
                            class="btn btn-success btn-lg ms-2">

                        Buy Now

                    </a>

                </div>

                <hr class="my-4">

                <h4>

                    Product Features

                </h4>

                <div class="feature">

                    ✔ Premium Quality Fabric

                </div>

                <div class="feature">

                    ✔ 100% Original Product

                </div>

                <div class="feature">

                    ✔ Cash On Delivery Available

                </div>

                <div class="feature">

                    ✔ 7 Days Easy Return

                </div>

                <div class="feature">

                    ✔ Free Shipping Above ₹999

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
