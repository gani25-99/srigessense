<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Product Details</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<div class="row">

<div class="col-md-5">

<img
th:src="@{'/images/products/' + ${product.image}}"
class="img-fluid rounded shadow">

</div>

<div class="col-md-7">

<h2 th:text="${product.name}"></h2>

<h3 class="text-success mt-3">

₹ <span th:text="${product.price}"></span>

</h3>

<p class="mt-4"
th:text="${product.description}"></p>

<hr>

<h5>

Category :

<span
th:text="${product.category.name}">
</span>

</h5>

<h5>

Stock :

<span
th:text="${product.quantity}">
</span>

</h5>

<div class="mt-4">

    <!-- Show Add to Cart only if stock is available -->
    <a
    th:if="${product.quantity > 0}"
    th:href="@{/cart/add/{id}(id=${product.id})}"
    class="btn btn-primary btn-lg">

    🛒 Add To Cart

    </a>

    <!-- Disabled button when out of stock -->
    <button
    th:if="${product.quantity == 0}"
    class="btn btn-secondary btn-lg"
    disabled>

    Out of Stock

    </button>

    <a
    th:href="@{/wishlist/add/{id}(id=${product.id})}"
    class="btn btn-danger btn-lg">

    ❤️ Wishlist

    </a>

</div>

</div>

</div>

</div>

</body>

</html>
