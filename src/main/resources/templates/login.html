<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SRIG ESSENSE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/login.css}">

</head>

<body>

<div class="overlay">

    <div class="login-box shadow-lg">

        <!-- Left Banner -->

        <div class="left-panel">

            <img src="/images/login-banner.jpg"
                 alt="Banner">

        </div>

        <!-- Right Login -->

        <div class="right-panel">

            <div class="text-center mb-4">

                <img src="/images/logo3.png"
                     class="logo">

                <h2>LOGIN OR SIGN UP</h2>

                <p class="text-muted">

                    Unlock coupons, profile and much more

                </p>

            </div>

            <!-- Tabs -->

            <div class="d-flex mb-4">

                <button id="mobileTab"
                        class="tab-btn active">

                    Mobile OTP

                </button>

                <button id="emailTab"
                        class="tab-btn">

                    Email Login

                </button>

            </div>

            <!-- Mobile Login -->

            <div id="mobileLogin">

                <form action="/login/send-otp" method="post">

                    <input
                            type="text"
                            name="mobile"
                            maxlength="10"
                            class="form-control mb-3"
                            placeholder="+91 Mobile Number"
                            required>

                    <button
                            class="btn btn-dark w-100">

                        SEND OTP

                    </button>

                </form>

            </div>

            <!-- Email Login -->

            <div id="emailLogin" style="display:none;">

                <form action="/login/email" method="post">

                    <input
                            type="email"
                            name="email"
                            class="form-control mb-3"
                            placeholder="Email"
                            required>

                    <input
                            type="password"
                            name="password"
                            class="form-control mb-3"
                            placeholder="Password"
                            required>

                    <button
                            class="btn btn-dark w-100">

                        LOGIN

                    </button>

                </form>

            </div>

            <div class="text-center mt-4">

                New User?

                <a href="/register">

                    Register

                </a>

            </div>

        </div>

    </div>

</div>

<script th:src="@{/js/login.js}"></script>

</body>

</html>
