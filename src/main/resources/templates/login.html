<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | SRIG ESSENSE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/auth.css}">

</head>

<body>

<div class="auth-container">

    <!-- LEFT -->

    <div class="left-panel">

        <div class="overlay">

            <img src="/images/srig-logo.png"
                 class="brand-logo"
                 alt="Logo">

            <h1>

                SRIG ESSENSE

            </h1>

            <h4>

                Own Your Style

            </h4>

            <p>

                Premium Fashion Collection
                Crafted For Your Lifestyle.

            </p>

        </div>

    </div>

    <!-- RIGHT -->

    <div class="right-panel">

        <div class="auth-card">

            <div class="text-center mb-4">

                <img src="/images/srig-logo.png"
                     class="logo">

                <h2>

                    Welcome Back

                </h2>

                <p class="text-muted">

                    Sign in to continue shopping

                </p>

            </div>

            <!-- EMAIL LOGIN -->
<div th:if="${error}"
     class="alert alert-danger text-center">

    <span th:text="${error}"></span>

</div>
            <form action="/login/email"
                  method="post"
                  id="emailForm">

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input

                            type="email"

                            name="email"

                            placeholder="Email Address"

                            required>

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input

                            type="password"

                            id="password"

                            name="password"

                            placeholder="Password"

                            required>

                    <i class="fa-solid fa-eye toggle-password"

                       onclick="togglePassword('password',this)"></i>

                </div>

                <div class="options">

                    <label>

                        <input type="checkbox">

                        Remember Me

                    </label>

                    <a href="/forgot-password">

                        Forgot Password?

                    </a>

                </div>

                <button

                        type="submit"

                        class="primary-btn">

                    LOGIN

                </button>
                                <div class="divider">

                    <span>

                        OR

                    </span>

                </div>

            </form>

            <!-- MOBILE OTP LOGIN -->

            <div class="mobile-title">

                Continue with Mobile OTP

            </div>

            <form action="/login/send-otp"
                  method="post"
                  id="mobileForm">

                <div class="input-box">

                    <i class="fa-solid fa-mobile-screen-button"></i>

                    <input

                            type="text"

                            name="mobile"

                            maxlength="10"

                            placeholder="Mobile Number"

                            required>

                </div>

                <button

                        type="submit"

                        class="secondary-btn">

                    SEND OTP

                </button>

            </form>

            <div class="signup-link">

                New User?

                <a href="/register">

                    Create Account →

                </a>

            </div>

           

        </div>

    </div>

</div>
    <script th:src="@{/js/auth.js}"></script>

</body>

</html>
