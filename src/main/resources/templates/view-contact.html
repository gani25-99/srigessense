<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>View Contact Message</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
    background:#f5f5f5;
}

.container{
    margin-top:40px;
    margin-bottom:40px;
}

.card{
    border:none;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
}

.card-header{
    background:#0d6efd;
    color:white;
    font-size:26px;
    font-weight:bold;
    text-align:center;
    padding:18px;
}

.info-label{
    font-weight:bold;
    color:#555;
}

.message-box{
    min-height:180px;
    background:#f8f9fa;
    border:1px solid #ddd;
    border-radius:8px;
    padding:15px;
    white-space:pre-wrap;
}

.badge{
    font-size:15px;
    padding:8px 16px;
}

.btn-action{
    min-width:140px;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="card-header">

Customer Contact Details

</div>

<div class="card-body">

<div class="row mb-3">

<div class="col-md-6">

<p>

<span class="info-label">

<i class="fa fa-user"></i>
 Name :

</span>

<span th:text="${message.name}"></span>

</p>

</div>

<div class="col-md-6">

<p>

<span class="info-label">

<i class="fa fa-envelope"></i>
 Email :

</span>

<span th:text="${message.email}"></span>

</p>

</div>

</div>

<div class="row mb-3">

<div class="col-md-6">

<p>

<span class="info-label">

<i class="fa fa-phone"></i>
 Mobile :

</span>

<span th:text="${message.mobile}"></span>

</p>

</div>

<div class="col-md-6">

<p>

<span class="info-label">

<i class="fa fa-calendar"></i>
 Date :

</span>

<span th:text="${#temporals.format(message.createdAt,'dd-MM-yyyy HH:mm')}"></span>

</p>

</div>

</div>

<div class="mb-3">

<p>

<span class="info-label">

<i class="fa fa-tag"></i>
 Subject :

</span>

<span th:text="${message.subject}"></span>

</p>

</div>

<div class="mb-4">

<label class="info-label mb-2">

<i class="fa fa-comment"></i>
 Message

</label>

<div class="message-box"
     th:text="${message.message}">
</div>

</div>

<div class="mb-4">

<span class="info-label">

Status :

</span>

<span th:if="${message.status=='OPEN'}"
      class="badge bg-danger">

OPEN

</span>

<span th:if="${message.status=='RESOLVED'}"
      class="badge bg-success">

RESOLVED

</span>

</div>

<div class="text-center">

<a th:href="@{'/admin/contact/reply/' + ${message.id}}"
class="btn btn-primary btn-action">

<i class="fa fa-reply"></i>

Reply

</a>

<a th:href="@{/admin/contact}"
class="btn btn-secondary btn-action">

<i class="fa fa-arrow-left"></i>

Back

</a>

</div>

</div>

</div>

</div>

</body>

</html>
