<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Customer Contact Messages</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
    background:#f5f5f5;
}

.container{
    margin-top:40px;
}

.card{
    border:none;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
}

.card-header{
    background:#0d6efd;
    color:white;
    font-size:26px;
    font-weight:bold;
    text-align:center;
}

.table th,
.table td{
    text-align:center;
    vertical-align:middle;
}

.badge{
    font-size:14px;
    padding:8px 14px;
}

.action-btn{
    margin:2px;
}

.dashboard-card{
    border-radius:10px;
    color:white;
}

</style>

</head>

<body>

<div class="container">

<div th:if="${success}"
class="alert alert-success"
th:text="${success}">
</div>

<!-- Dashboard -->

<div class="row mb-4">

<div class="col-md-4">

<div class="card dashboard-card bg-primary">

<div class="card-body text-center">

<h5>Total Messages</h5>

<h2 th:text="${totalMessages}"></h2>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card dashboard-card bg-danger">

<div class="card-body text-center">

<h5>Open Messages</h5>

<h2 th:text="${openMessages}"></h2>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card dashboard-card bg-success">

<div class="card-body text-center">

<h5>Resolved Messages</h5>

<h2 th:text="${resolvedMessages}"></h2>

</div>

</div>

</div>

</div>

<div class="card">

<div class="card-header">

Customer Contact Messages

</div>

<div class="card-body">

<!-- Search -->

<form th:action="@{/admin/contact}" method="get">

<div class="row mb-3">

<div class="col-md-6">

<input
type="text"
name="keyword"
class="form-control"
placeholder="Search by Name, Email or Subject"
th:value="${keyword}">

</div><br><br>

<div class="col-md-2">

<button class="btn btn-primary">

<i class="fa fa-search"></i>

Search

</button>

</div><br><br>

<div class="col-md-2">

<a th:href="@{/admin/contact}"
class="btn btn-secondary">
Reset

</a>

</div>

</div>

</form>

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>ID</th>

<th>Name</th>

<th>Email</th>

<th>Mobile</th>

<th>Subject</th>

<th>Status</th>

<th>Date</th>

<th>Actions</th>

</tr>

</thead>

<tbody>

<tr th:each="msg : ${messages}">

<td th:text="${msg.id}"></td>

<td th:text="${msg.name}"></td>

<td th:text="${msg.email}"></td>

<td th:text="${msg.mobile}"></td>

<td th:text="${msg.subject}"></td>

<td>

<span
th:if="${msg.status=='OPEN'}"
class="badge bg-danger">

OPEN

</span>

<span
th:if="${msg.status=='RESOLVED'}"
class="badge bg-success">

RESOLVED

</span>

</td>

<td
th:text="${#temporals.format(msg.createdAt,'dd-MM-yyyy HH:mm')}">
</td>

<td>

<a th:href="@{'/admin/contact/view/' + ${msg.id}}"
class="btn btn-primary btn-sm action-btn">

<i class="fa fa-eye"></i>

View

</a>

<a th:href="@{'/admin/contact/resolve/' + ${msg.id}}"
class="btn btn-success btn-sm action-btn"
onclick="return confirm('Mark this message as resolved?');">

<i class="fa fa-check"></i>

Resolve

</a>

<a th:href="@{'/admin/contact/delete/' + ${msg.id}}"
class="btn btn-danger btn-sm action-btn"
onclick="return confirm('Delete this message?');">

<i class="fa fa-trash"></i>

Delete

</a>

</td>

</tr>

<tr th:if="${#lists.isEmpty(messages)}">

<td colspan="8" class="text-center text-muted">

No Contact Messages Available

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

</body>

</html>
