<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Reset Password</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
th:href="@{/css/login.css}">

</head>

<body>

<div class="login-container">

<div class="right-panel w-100">

<div class="login-card">

<div class="text-center mb-4">

<img src="/images/logo3.png"
class="logo">

<h2>Reset Password</h2>

<p class="text-muted">

Enter OTP and New Password

</p>

</div>

<form action="/forgot-password/reset"
method="post">

<input
type="hidden"
name="email"
th:value="${email}">

<div class="mb-3">

<label>OTP</label>

<input
type="text"
name="otp"
maxlength="6"
class="form-control"
required>

</div>

<div class="mb-3">

<label>New Password</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Confirm Password</label>

<input
type="password"
name="confirmPassword"
class="form-control"
required>

</div>

<button
class="btn btn-dark w-100">

RESET PASSWORD

</button>

</form>

<p
class="text-danger mt-3"
th:text="${error}"></p>

</div>

</div>

</div>

</body>

</html>
