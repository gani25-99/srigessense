<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <title>SRIG ESSENSE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f1f3f6;
        }

        .navbar{
            background:#2874f0 !important;
        }

        .navbar-brand{
            font-weight:bold;
            font-size:24px;
        }

        .logo{
            width:45px;
            height:45px;
            border-radius:50%;
            margin-right:10px;
        }

        .card{
            transition:.3s;
        }

        .card:hover{
            transform:translateY(-5px);
            box-shadow:0 5px 20px rgba(0,0,0,.2);
        }

        .card img{
            height:250px;
            object-fit:cover;
        }

    </style>

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark">

<div class="container">

<a class="navbar-brand d-flex align-items-center"
href="/home">

<img
src="/images/logo3.png"
class="logo">

SRIG ESSENSE

</a>

<form class="d-flex"
action="/search"
method="get">

<input
type="text"
name="keyword"
class="form-control me-2"
placeholder="Search Products">

<button class="btn btn-warning">

Search

</button>

</form>

<div>

<a href="/wishlist"
class="btn btn-outline-light me-2">

❤️ Wishlist

</a>



<a href="/cart"
class="btn btn-warning">

🛒 Cart

</a>
<a href="/dashboard"
class="btn btn-light me-2">

👤 Dashboard

</a>

</div>

</div>

</nav>

<!-- Categories -->

<div class="container mt-4">

<h4 class="mb-3">

Shop By Category

</h4>

<a href="/home"
class="btn btn-dark me-2">

All

</a>

<a href="/category?id=1"
class="btn btn-primary me-2">

Mobiles

</a>

<a href="/category?id=2"
class="btn btn-success me-2">

Laptops

</a>

<a href="/category?id=3"
class="btn btn-warning me-2">

Fashion

</a>

<a href="/category?id=4"
class="btn btn-danger">

Groceries

</a>

</div>

<!-- Products -->

<div class="container mt-5">

<h2 class="mb-4">

Featured Products

</h2>

<div class="row">

<div
class="col-md-3 mb-4"
th:each="product : ${products}">

<div class="card h-100">

<img
th:src="@{'/images/products/' + ${product.image}}"
class="card-img-top"
th:alt="${product.name}">

<div class="card-body">

<h5
th:text="${product.name}">
</h5>

<p
th:text="${product.description}">
</p>

<h4 class="text-success">

₹ <span th:text="${product.price}"></span>

</h4>

<div class="d-grid gap-2">

<a
th:href="@{/product/{id}(id=${product.id})}"
class="btn btn-info">

👁 View Details

</a>

<a
th:href="@{/cart/add/{id}(id=${product.id})}"
class="btn btn-primary">

🛒 Add To Cart

</a>

<a
th:href="@{/wishlist/add/{id}(id=${product.id})}"
class="btn btn-outline-danger">

❤️ Add Wishlist

</a>

</div>

</div>

</div>

</div>

</div>

</div>

<!-- Footer -->

<footer class="bg-dark text-white text-center mt-5 p-4">

<h5>

SRIG ESSENSE

</h5>

<p>

Beauty & Personal Care Store

</p>

<p>

© 2026 All Rights Reserved

</p>

</footer>

</body>

</html>
