<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SRIG ESSENSE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f1f3f6;
            font-family:Arial,Helvetica,sans-serif;
        }

        /* Navbar */

        .navbar{
            background:#2874f0 !important;
        }

        .navbar-brand{
            font-weight:bold;
            font-size:24px;
        }

        .logo{
            width:45px;
            height:45px;
            border-radius:50%;
            margin-right:10px;
        }

        /* Product Cards */

        .card{
            border:none;
            border-radius:12px;
            overflow:hidden;
            transition:.3s;
            height:100%;
        }

        .card:hover{
            transform:translateY(-5px);
            box-shadow:0 8px 20px rgba(0,0,0,.2);
        }

        .card img{
            height:250px;
            object-fit:cover;
        }

        .card-body h5{
            font-weight:bold;
        }

        .card-body p{
            font-size:14px;
            color:#666;
            min-height:45px;
        }

        .btn{
            border-radius:8px;
        }

        footer{
            margin-top:60px;
        }

        /* Mobile */

        @media(max-width:768px){

            .navbar-brand{
                font-size:18px;
            }

            .logo{
                width:35px;
                height:35px;
            }

            .card img{
                height:180px;
            }

            h2{
                font-size:24px;
            }

            .navbar form{
                margin-top:15px;
            }

            .navbar .btn{
                margin-top:8px;
                width:100%;
            }

        }

    </style>

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container">

        <a class="navbar-brand d-flex align-items-center" href="/home">

            <img src="/images/logo3.png"
                 class="logo"
                 alt="Logo">

            SRIG ESSENSE

        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">

            <!-- Search -->

            <form class="d-flex ms-lg-auto my-3 my-lg-0"
                  action="/search"
                  method="get">

                <input type="text"
                       name="keyword"
                       class="form-control me-2"
                       placeholder="Search Products">

                <button class="btn btn-warning">
                    Search
                </button>

            </form>

            <!-- Buttons -->

            <div class="ms-lg-3">

                <a href="/wishlist"
                   class="btn btn-outline-light me-lg-2">
                    ❤️ Wishlist
                </a>

                <a href="/cart"
                   class="btn btn-warning me-lg-2">
                    🛒 Cart
                </a>

                <a href="/dashboard"
                   class="btn btn-light">
                    👤 Dashboard
                </a>

            </div>

        </div>

    </div>

</nav>

<!-- ================= CATEGORY ================= -->

<div class="container mt-4">

    <h4 class="mb-3">

        Shop By Category

    </h4>

    <div class="d-flex flex-wrap gap-2">

        <a href="/home"
           class="btn btn-dark">
            All
        </a>

        <a href="/category?id=1"
           class="btn btn-primary">
            Mobiles
        </a>

        <a href="/category?id=2"
           class="btn btn-success">
            Laptops
        </a>

        <a href="/category?id=3"
           class="btn btn-warning">
            Fashion
        </a>

        <a href="/category?id=4"
           class="btn btn-danger">
            Groceries
        </a>

    </div>

</div>

<!-- ================= PRODUCTS ================= -->

<div class="container mt-5">

    <h2 class="mb-4">

        Featured Products

    </h2>

    <div class="row g-4">

        <div class="col-12 col-sm-6 col-md-4 col-lg-3"
             th:each="product : ${products}">

            <div class="card shadow-sm">

                <img th:src="@{'/images/products/' + ${product.image}}"
                     class="card-img-top"
                     th:alt="${product.name}">

                <div class="card-body">

                    <h5 th:text="${product.name}">
                        Product Name
                    </h5>

                    <p th:text="${product.description}">
                        Product Description
                    </p>

                    <h4 class="text-success">

                        ₹ <span th:text="${product.price}"></span>

                    </h4>

                    <div class="d-grid gap-2 mt-3">

                        <a th:href="@{/product/{id}(id=${product.id})}"
                           class="btn btn-info">

                            👁 View Details

                        </a>

                        <a th:href="@{/cart/add/{id}(id=${product.id})}"
                           class="btn btn-primary">

                            🛒 Add To Cart

                        </a>

                        <a th:href="@{/wishlist/add/{id}(id=${product.id})}"
                           class="btn btn-outline-danger">

                            ❤️ Add Wishlist

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- ================= FOOTER ================= -->

<footer class="bg-dark text-white text-center p-4">

    <h5>

        SRIG ESSENSE

    </h5>

    <p>

        Beauty & Personal Care Store

    </p>

    <p>

        © 2026 All Rights Reserved

    </p>

</footer>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
