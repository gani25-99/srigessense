<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | SRIG ESSENSE</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">

    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link
            rel="stylesheet"
            th:href="@{/css/register.css}">

</head>

<body>

<div class="register-container">

    <!-- LEFT PANEL -->

    <div class="left-panel">

        <div class="overlay">

            <img
                    src="/images/logo3.png"
                    class="brand-logo"
                    alt="Logo">

            <h1>

                SRIG ESSENSE

            </h1>

            <h4>

                Own Your Style

            </h4>

            <p>

                Premium Fashion
                Crafted For Modern Lifestyle

            </p>

        </div>

    </div>

    <!-- RIGHT PANEL -->

    <div class="right-panel">

        <div class="register-card">

            <div class="text-center mb-4">

                <img
                        src="/images/logo3.png"
                        class="logo">

                <h2>

                    Create Account

                </h2>

                <p class="text-muted">

                    Join the SRIG ESSENSE Family

                </p>

            </div>

            <form
                    action="/register/send-otp"
                    method="post">

                <!-- EMAIL -->

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input

                            type="email"

                            name="email"

                            placeholder="Email Address"

                            required>

                </div>

                <!-- MOBILE -->

                <div class="input-box">

                    <i class="fa-solid fa-mobile-screen-button"></i>

                    <input

                            type="text"

                            name="mobile"

                            maxlength="10"

                            placeholder="Mobile Number"

                            required>

                </div>

                <!-- PASSWORD -->

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input

                            type="password"

                            id="password"

                            name="password"

                            placeholder="Password"

                            required>

                    <i

                            class="fa-solid fa-eye toggle-password"

                            onclick="togglePassword('password',this)">

                    </i>

                </div>
                                <!-- CONFIRM PASSWORD -->

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input

                            type="password"

                            id="confirmPassword"

                            name="confirmPassword"

                            placeholder="Confirm Password"

                            required>

                    <i

                            class="fa-solid fa-eye toggle-password"

                            onclick="togglePassword('confirmPassword',this)">

                    </i>

                </div>

                <!-- PASSWORD STRENGTH -->

                <div class="strength">

                    <div id="strengthBar"></div>

                </div>

                <small id="strengthText">

                    Password Strength

                </small>

                <!-- TERMS -->

                <div class="terms">

                    <label>

                        <input

                                type="checkbox"

                                required>

                        I agree to the

                        <a href="#">

                            Terms & Conditions

                        </a>

                    </label>

                </div>

                <!-- BUTTON -->

                <button

                        type="submit"

                        class="register-btn">

                    CREATE ACCOUNT →

                </button>

            </form>

            <div class="divider">

                <span>

                    OR

                </span>

            </div>

            <div class="social-login">

                <button

                        type="button"

                        class="google-btn">

                    <i class="fa-brands fa-google"></i>

                    Continue with Google

                </button>

            </div>

            <div class="login-link">

                Already have an account?

                <a href="/login">

                    Sign In →

                </a>

            </div>

        </div>

    </div>
                <!-- Footer -->

            <div class="footer-text">

                <small>

                    © 2026 SRIG ESSENSE. All Rights Reserved.

                </small>

            </div>

        </div>

    </div>

</div>

<script th:src="@{/js/register.js}"></script>

</body>

</html>
