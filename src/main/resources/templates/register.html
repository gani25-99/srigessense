<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | SRIG ESSENSE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/auth.css}">

</head>

<body>

<div class="auth-container">

    <!-- LEFT PANEL -->

    <div class="left-panel">

        <div class="overlay">

            <img src="/images/srig-logo.png"
                 class="brand-logo"
                 alt="Logo">

            <h1>

                SRIG ESSENSE

            </h1>

            <h4>

                Own Your Style

            </h4>

            <p>

                Create your account and
                start shopping with us.

            </p>

        </div>

    </div>

    <!-- RIGHT PANEL -->

    <div class="right-panel">

        <div class="auth-card">

            <div class="text-center mb-4">

                <img src="/images/srig-logo.png"
                     class="logo">

                <h2>

                    Create Account

                </h2>

                <p class="text-muted">

                    Join the SRIG ESSENSE Family

                </p>

            </div>

            <div th:if="${error}"
                 class="alert alert-danger text-center">

                <span th:text="${error}"></span>

            </div>

            <form id="registerForm"
                  action="/register/send-otp"
                  method="post">

                <!-- Full Name -->

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input
                            type="text"
                            name="name"
                            placeholder="Full Name"
                            required>

                </div>

                <!-- Email -->

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                            type="email"
                            name="email"
                            placeholder="Email Address"
                            required>

                </div>

                <!-- Mobile -->

                <div class="input-box">

                    <i class="fa-solid fa-mobile-screen-button"></i>

                    <input
                            type="text"
                            name="mobile"
                            maxlength="10"
                            placeholder="Mobile Number"
                            required>

                </div>
                                <!-- Password -->

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Password"
                            required>

                    <i class="fa-solid fa-eye toggle-password"
                       onclick="togglePassword('password',this)"></i>

                </div>

                <!-- Confirm Password -->

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm Password"
                            required>

                    <i class="fa-solid fa-eye toggle-password"
                       onclick="togglePassword('confirmPassword',this)"></i>

                </div>

                <!-- Password Strength -->

                <div class="strength">

                    <div id="strengthBar"></div>

                </div>

                <small id="strengthText">

                    Password Strength

                </small>

                <!-- Terms -->

                <div class="terms">

                    <label>

                        <input
                                type="checkbox"
                                required>

                        I agree to the

                        <a href="#">

                            Terms & Conditions

                        </a>

                    </label>

                </div>

                <button
                        type="submit"
                        class="primary-btn">

                    CREATE ACCOUNT

                </button>

            </form>

            <div class="signup-link">

                Already have an account?

                <a href="/login">

                    Login →

                </a>

            </div>
                    </div>

    </div>

</div>

<script>

const password=document.getElementById("password");

const confirmPassword=document.getElementById("confirmPassword");

const strengthBar=document.getElementById("strengthBar");

const strengthText=document.getElementById("strengthText");

password.addEventListener("keyup",function(){

    const value=password.value;

    let strength=0;

    if(value.length>=8) strength++;

    if(/[A-Z]/.test(value)) strength++;

    if(/[0-9]/.test(value)) strength++;

    if(/[^A-Za-z0-9]/.test(value)) strength++;

    switch(strength){

        case 1:

            strengthBar.style.width="25%";
            strengthBar.style.background="red";
            strengthText.innerHTML="Weak Password";

            break;

        case 2:

            strengthBar.style.width="50%";
            strengthBar.style.background="orange";
            strengthText.innerHTML="Medium Password";

            break;

        case 3:

            strengthBar.style.width="75%";
            strengthBar.style.background="#0dcaf0";
            strengthText.innerHTML="Strong Password";

            break;

        case 4:

            strengthBar.style.width="100%";
            strengthBar.style.background="green";
            strengthText.innerHTML="Very Strong Password";

            break;

        default:

            strengthBar.style.width="0";
            strengthText.innerHTML="Password Strength";

    }

});

document.getElementById("registerForm")
.addEventListener("submit",function(e){

    if(password.value!==confirmPassword.value){

        alert("Passwords do not match.");

        e.preventDefault();

    }

});
function togglePassword(id,icon){

    const input=document.getElementById(id);

    if(input.type==="password"){

        input.type="text";

        icon.classList.remove("fa-eye");

        icon.classList.add("fa-eye-slash");

    }else{

        input.type="password";

        icon.classList.remove("fa-eye-slash");

        icon.classList.add("fa-eye");

    }

}

</script>

<script th:src="@{/js/auth.js}"></script>

</body>

</html>
