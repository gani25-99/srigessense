<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Verify Mobile Login OTP | SRIG ESSENSE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/auth.css}">

</head>

<body>

<div class="auth-container">

    <div class="left-panel">

        <div class="overlay">

            <img src="/images/logo3.png"
                 class="brand-logo">

            <h1>

                SRIG ESSENSE

            </h1>

            <h4>

                Own Your Style

            </h4>

            <p>

                Verify your Mobile OTP
                to continue login.

            </p>

        </div>

    </div>

    <div class="right-panel">

        <div class="auth-card">

            <div class="text-center mb-4">

                <img src="/images/logo3.png"
                     class="logo">

                <h2>

                    Mobile Login OTP

                </h2>

                <p class="text-muted">

                    Enter the OTP sent to your mobile.

                </p>

            </div>

            <form action="/login/verify-otp"
                  method="post">

                <input
                        type="hidden"
                        name="mobile"
                        th:value="${mobile}">

                <div class="input-box">

                    <i class="fa-solid fa-key"></i>

                    <input
                            type="text"
                            name="otp"
                            maxlength="6"
                            placeholder="Enter OTP"
                            required>

                </div>

                <button
                        type="submit"
                        class="primary-btn">

                    VERIFY OTP

                </button>

            </form>

            <p class="text-danger text-center mt-3"
               th:text="${error}"></p>

            <div class="signup-link">

                <a href="/login">

                    ← Back to Login

                </a>

            </div>

        </div>

    </div>

</div>

<script th:src="@{/js/auth.js}"></script>

</body>

</html>
