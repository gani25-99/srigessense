<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Reply to Customer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{
    background:#f5f5f5;
}

.container{
    margin-top:40px;
}

.card{
    max-width:800px;
    margin:auto;
    border:none;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
}

.card-header{
    background:#0d6efd;
    color:white;
    font-size:25px;
    font-weight:bold;
    text-align:center;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="card-header">

Reply to Customer

</div>

<div class="card-body">

<div th:if="${success}"
class="alert alert-success"
th:text="${success}">
</div>

<form th:action="@{/admin/contact/sendReply}"
method="post">

<input type="hidden"
name="id"
th:value="${message.id}">

<div class="mb-3">

<label class="form-label">

Customer Name

</label>

<input type="text"
class="form-control"
th:value="${message.name}"
readonly>

</div>

<div class="mb-3">

<label class="form-label">

Email

</label>

<input type="email"
name="email"
class="form-control"
th:value="${message.email}"
readonly>

</div>

<div class="mb-3">

<label class="form-label">

Subject

</label>

<input type="text"
name="subject"
class="form-control"
placeholder="Reply Subject"
required>

</div>

<div class="mb-3">

<label class="form-label">

Reply Message

</label>

<textarea
name="body"
rows="8"
class="form-control"
placeholder="Type your reply..."
required></textarea>

</div>

<div class="text-center">

<button
class="btn btn-success">

Send Reply

</button>

<a th:href="@{/admin/contact}"
class="btn btn-secondary">

Cancel

</a>

</div>

</form>

</div>

</div>

</div>

</body>

</html>
