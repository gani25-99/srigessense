<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Categories | SRIG ESSENSE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">

        Category Management

    </h2>

    <!-- Add Category -->

    <div class="card shadow mb-4">

        <div class="card-header bg-primary text-white">

            Add Category

        </div>

        <div class="card-body">

            <form action="/admin/categories/save"
                  method="post">

                <input type="hidden"
                       name="id"
                       th:value="${category.id}">

                <div class="row">

                    <div class="col-md-10">

                        <input
                                type="text"
                                class="form-control"
                                name="name"
                                placeholder="Enter Category Name"
                                th:value="${category.name}"
                                required>

                    </div>

                    <div class="col-md-2">

                        <button
                                class="btn btn-success w-100">

                            <i class="fa-solid fa-floppy-disk"></i>

                            Save

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

    <!-- Search -->

    <div class="row mb-3">

        <div class="col-md-8">

            <form action="/admin/categories/search"
                  method="get">

                <div class="input-group">

                    <input
                            type="text"
                            name="keyword"
                            class="form-control"
                            placeholder="Search Category">

                    <button
                            class="btn btn-primary">

                        <i class="fa-solid fa-magnifying-glass"></i>

                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- Category Table -->

    <div class="card shadow">

        <div class="card-header bg-dark text-white">

            Categories

        </div>

        <div class="card-body">

            <table class="table table-bordered table-hover">

                <thead class="table-light">

                <tr>

                    <th>ID</th>

                    <th>Category</th>

                    <th width="180">

                        Actions

                    </th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="cat : ${categories}">

                    <td th:text="${cat.id}"></td>

                    <td th:text="${cat.name}"></td>

                    <td>

                        <a
                           th:href="@{/admin/categories/edit/{id}(id=${cat.id})}"
                           class="btn btn-warning btn-sm">

                            <i class="fa-solid fa-pen"></i>

                        </a>

                        <a
                           th:href="@{/admin/categories/delete/{id}(id=${cat.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Delete this category?');">

                            <i class="fa-solid fa-trash"></i>

                        </a>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(categories)}">

                    <td colspan="3"
                        class="text-center">

                        No Categories Found

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

    <div class="mt-4">

        <a href="/admin/dashboard"
           class="btn btn-secondary">

            <i class="fa-solid fa-arrow-left"></i>

            Back to Dashboard

        </a>

    </div>

</div>

</body>

</html>
