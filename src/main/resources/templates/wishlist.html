<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Wishlist</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2 class="mb-4">

❤️ My Wishlist

</h2>

<div class="row">

<div
class="col-md-3 mb-4"
th:each="item : ${items}">

<div class="card shadow h-100">

<img
th:src="@{'/images/products/' + ${item.product.image}}"
class="card-img-top"
style="height:220px;object-fit:cover;">

<div class="card-body">

<h5 th:text="${item.product.name}"></h5>

<p th:text="${item.product.description}"></p>

<h6 class="text-success">

₹ <span th:text="${item.product.price}"></span>

</h6>

<a
th:href="@{/cart/add/{id}(id=${item.product.id})}"
class="btn btn-primary w-100 mb-2">

Add To Cart

</a>

<a
th:href="@{/wishlist/delete/{id}(id=${item.id})}"
class="btn btn-danger w-100">

Remove

</a>

</div>

</div>

</div>

</div>

<div class="mt-3">

<a href="/home" class="btn btn-success">

Continue Shopping

</a>

</div>

</div>

</body>

</html>
