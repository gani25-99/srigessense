





<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Shopping Cart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4 text-center">

        Shopping Cart

    </h2>

    <table class="table table-bordered table-hover align-middle">

        <thead class="table-dark">

        <tr>

            <th>Image</th>

            <th>Product</th>

            <th>Price</th>

            <th>Quantity</th>

            <th>Action</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="item : ${cartItems}">

            <td width="150">

                <img
                        th:src="@{'/images/products/' + ${item.product.image}}"
                        width="120"
                        height="120"
                        style="object-fit:cover;">

            </td>

            <td>

                <h5 th:text="${item.product.name}"></h5>

            </td>

            <td>

                ₹ <span th:text="${item.product.price}"></span>

            </td>

            <td>

                <a
                        th:href="@{/cart/decrease/{id}(id=${item.id})}"
                        class="btn btn-danger btn-sm">

                    -

                </a>

                <span
                        class="mx-3 fw-bold"
                        th:text="${item.quantity}">

                </span>

                <a
                        th:href="@{/cart/increase/{id}(id=${item.id})}"
                        class="btn btn-success btn-sm">

                    +

                </a>

            </td>

            <td>

                <a
                        th:href="@{/cart/delete/{id}(id=${item.id})}"
                        class="btn btn-danger">

                    Remove

                </a>

            </td>

        </tr>

        </tbody>

    </table>

    <hr>

<div class="text-end">

    <h3>

        Total :
        ₹ <span th:text="${total}"></span>

    </h3>

</div>

<div class="mt-4 d-flex justify-content-between">

    <a
            href="/home"
            class="btn btn-primary">

        ← Continue Shopping

    </a>

    <a
            href="/checkout"
            class="btn btn-success">

        Checkout →

    </a>

</div>

</div>

</body>

</html>
