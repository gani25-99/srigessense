
<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Shopping Cart | SRIG ESSENSE</title>


    <!-- ==========================
         BOOTSTRAP
    ========================== -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- ==========================
         FONT AWESOME
    ========================== -->

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
          rel="stylesheet">


    <style>

        /* ==========================
           BODY
        ========================== */

        body {
            background: #f5f5f5;
        }


        /* ==========================
           CART CARD
        ========================== */

        .cart-card {
            background: #ffffff;

            border-radius: 15px;

            padding: 25px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);
        }


        /* ==========================
           PRODUCT IMAGE
        ========================== */

        .product-img {
            width: 110px;

            height: 110px;

            object-fit: cover;

            border-radius: 10px;
        }


        /* ==========================
           SUMMARY
        ========================== */

        .summary {
            background: #ffffff;

            border-radius: 15px;

            padding: 25px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);
        }


        /* ==========================
           TABLE
        ========================== */

        .table td {
            vertical-align: middle;
        }


        /* ==========================
           QUANTITY
        ========================== */

        .qty {
            font-weight: bold;

            font-size: 18px;
        }


        /* ==========================
           EMPTY CART
        ========================== */

        .empty-cart img {
            width: 220px;
        }


        /* ==========================
           CHECKBOX
        ========================== */

        .select-product {
            width: 20px;

            height: 20px;

            cursor: pointer;
        }


        .select-label {
            font-weight: 600;

            cursor: pointer;
        }


        /* ==========================
           SELECTED COUNT
        ========================== */

        #selectedCount {
            font-weight: 600;

            color: #198754;
        }


        /* ==========================
           GRAND TOTAL
        ========================== */

        #selectedTotal {
            font-weight: 700;

            color: #198754;
        }


        /* ==========================
           MOBILE
        ========================== */

        @media (max-width: 768px) {

            .cart-card {
                padding: 12px;

                overflow-x: auto;
            }

            .product-img {
                width: 80px;

                height: 80px;
            }

            .summary {
                padding: 18px;
            }

        }

    </style>

</head>


<body>


<div class="container py-5">


    <!-- ==========================
         TITLE
    ========================== -->

    <h2 class="fw-bold mb-4">

        🛒 Shopping Cart

    </h2>


    <!-- ==========================
         EMPTY CART
    ========================== -->

    <div th:if="${#lists.isEmpty(cartItems)}"
         class="text-center empty-cart">

        <img src="/images/srig-logo.png"
             alt="Empty Cart">

        <h3 class="mt-4">

            Your Cart is Empty

        </h3>

        <p class="text-muted">

            Start shopping and add your favourite products.

        </p>

        <a href="/home"
           class="btn btn-dark">

            Continue Shopping

        </a>

    </div>


    <!-- ==========================
         CART
    ========================== -->

    <div th:unless="${#lists.isEmpty(cartItems)}">


        <!-- ==========================
             CHECKOUT FORM
        ========================== -->

        <form action="/cart/checkout-selected"
              method="post"
              id="cartForm">


            <!-- ==========================
                 CART CARD
            ========================== -->

            <div class="cart-card">


                <!-- ==========================
                     SELECT ALL
                ========================== -->

                <div class="d-flex align-items-center mb-4">

                    <input
                            type="checkbox"
                            id="selectAll"
                            class="select-product me-2">


                    <label
                            for="selectAll"
                            class="select-label">

                        Select All

                    </label>


                    <span
                            class="ms-3"
                            id="selectedCount">

                        0 selected

                    </span>

                </div>


                <!-- ==========================
                     PRODUCT TABLE
                ========================== -->

                <table class="table align-middle">


                    <thead>

                    <tr>

                        <th style="width: 60px;">

                            Select

                        </th>

                        <th>

                            Product

                        </th>

                        <th>

                            Price

                        </th>

                        <th>

                            Quantity

                        </th>

                        <th>

                            Total

                        </th>

                        <th>

                        </th>

                    </tr>

                    </thead>


                    <tbody>


                    <!-- ==========================
                         EACH CART ITEM
                    ========================== -->

                    <tr th:each="item : ${cartItems}">


                        <!-- ==========================
                             CHECKBOX
                        ========================== -->

                        <td>

                            <input
                                    type="checkbox"

                                    class="select-product product-checkbox"

                                    name="cartIds"

                                    th:value="${item.id}"

                                    th:attr="data-total=${item.product.price * item.quantity}">

                        </td>


                        <!-- ==========================
                             PRODUCT
                        ========================== -->

                        <td>

                            <div class="d-flex">


                                <img

                                        th:src="@{'/products/' + ${item.product.image}}"

                                        class="product-img"

                                        alt="Product"

                                        onerror="this.src='/images/logo3.png'">


                                <div class="ms-3">


                                    <h5
                                            th:text="${item.product.name}">
                                    </h5>


                                    <p class="text-muted mb-1">

                                        Category :

                                        <span
                                                th:text="${item.product.category.name}">
                                        </span>

                                    </p>


                                    <small class="text-success">

                                        Stock :

                                        <span
                                                th:text="${item.product.quantity}">
                                        </span>

                                    </small>


                                </div>

                            </div>

                        </td>


                        <!-- ==========================
                             PRICE
                        ========================== -->

                        <td>

                            ₹

                            <span
                                    th:text="${item.product.price}">
                            </span>

                        </td>


                        <!-- ==========================
                             QUANTITY
                        ========================== -->

                        <td>


                            <a
                                    th:href="@{/cart/decrease/{id}(id=${item.product.id})}"

                                    class="btn btn-outline-danger btn-sm">

                                -

                            </a>


                            <span
                                    class="qty mx-3"
                                    th:text="${item.quantity}">
                            </span>


                            <a
                                    th:href="@{/cart/increase/{id}(id=${item.product.id})}"

                                    class="btn btn-outline-success btn-sm">

                                +

                            </a>


                        </td>


                        <!-- ==========================
                             ITEM TOTAL
                        ========================== -->

                        <td>

                            <strong>

                                ₹

                                <span
                                        th:text="${item.product.price * item.quantity}">
                                </span>

                            </strong>

                        </td>


                        <!-- ==========================
                             REMOVE
                        ========================== -->

                        <td>

                            <a
                                    th:href="@{/cart/remove/{id}(id=${item.product.id})}"

                                    class="btn btn-danger">

                                <i class="fa-solid fa-trash"></i>

                            </a>

                        </td>


                    </tr>


                    </tbody>

                </table>

            </div>


            <!-- ==========================
                 CART SUMMARY
            ========================== -->

            <div class="summary mt-4">


                <div class="row">


                    <!-- ==========================
                         SUMMARY LEFT
                    ========================== -->

                    <div class="col-md-6">


                        <h4>

                            Cart Summary

                        </h4>


                        <p>

                            Total Products :

                            <strong
                                    th:text="${#lists.size(cartItems)}">

                            </strong>

                        </p>


                        <p>

                            Selected Products :

                            <strong
                                    id="selectedProducts">

                                0

                            </strong>

                        </p>


                    </div>


                    <!-- ==========================
                         GRAND TOTAL
                    ========================== -->

                    <div class="col-md-6 text-end">


                        <h3>

                            Grand Total

                        </h3>


                        <h2 class="text-success">

                            ₹

                            <span id="selectedTotal">

                                0.00

                            </span>

                        </h2>


                    </div>

                </div>


                <hr>


                <!-- ==========================
                     BUTTONS
                ========================== -->

                <div class="d-flex justify-content-between">


                    <a
                            href="/home"

                            class="btn btn-outline-dark btn-lg">

                        ← Continue Shopping

                    </a>


                    <button
                            type="submit"

                            class="btn btn-success btn-lg"

                            id="checkoutButton"

                            disabled>

                        Proceed To Checkout →

                    </button>


                </div>


            </div>


        </form>

    </div>

</div>


<!-- ==========================
     JAVASCRIPT
========================== -->

<script>


    /* ==========================
       ELEMENTS
    ========================== */

    const selectAll =
        document.getElementById("selectAll");


    const checkboxes =
        document.querySelectorAll(
            ".product-checkbox"
        );


    const checkoutButton =
        document.getElementById(
            "checkoutButton"
        );


    const selectedCount =
        document.getElementById(
            "selectedCount"
        );


    const selectedProducts =
        document.getElementById(
            "selectedProducts"
        );


    const selectedTotal =
        document.getElementById(
            "selectedTotal"
        );


    /* ==========================
       UPDATE SELECTION
    ========================== */

    function updateSelection() {


        const selected =
            document.querySelectorAll(
                ".product-checkbox:checked"
            );


        let total = 0;


        /* ==========================
           CALCULATE ONLY SELECTED
        ========================== */

        selected.forEach(
            function (checkbox) {

                const itemTotal =
                    parseFloat(
                        checkbox.dataset.total
                    ) || 0;


                total += itemTotal;

            }
        );


        /* ==========================
           SELECTED COUNT
        ========================== */

        selectedCount.textContent =
            selected.length
            + " selected";


        /* ==========================
           SELECTED PRODUCTS
        ========================== */

        selectedProducts.textContent =
            selected.length;


        /* ==========================
           GRAND TOTAL
        ========================== */

        selectedTotal.textContent =
            total.toFixed(2);


        /* ==========================
           CHECKOUT BUTTON
        ========================== */

        checkoutButton.disabled =
            selected.length === 0;


        /* ==========================
           SELECT ALL CHECKBOX
        ========================== */

        selectAll.checked =
            selected.length === checkboxes.length
            && checkboxes.length > 0;

    }


    /* ==========================
       SELECT ALL
    ========================== */

    selectAll.addEventListener(
        "change",
        function () {


            checkboxes.forEach(
                function (checkbox) {

                    checkbox.checked =
                        selectAll.checked;

                }
            );


            updateSelection();

        }
    );


    /* ==========================
       INDIVIDUAL SELECTION
    ========================== */

    checkboxes.forEach(
        function (checkbox) {


            checkbox.addEventListener(
                "change",
                function () {

                    updateSelection();

                }
            );

        }
    );


    /* ==========================
       INITIAL TOTAL
    ========================== */

    updateSelection();


</script>


</body>

</html>
